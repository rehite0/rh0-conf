
#gesture
gesture = 4, horizontal, workspace
# gesture = 3, horizontal, scroll_move
gesture = 4, vertical, fullscreen
gesture = 3, vertical, float
# gesture = 3, left, scale: 1.5, float

#scrolling keybind
bind = SUPER, comma, layoutmsg, move -col
bind = SUPER, period, layoutmsg, move +col
bind = SUPER SHIFT, comma, layoutmsg, swapcol l
bind = SUPER SHIFT, period, layoutmsg, swapcol r
bind = SUPER ALT, comma, layoutmsg, consume prev
bind = SUPER ALT, period, layoutmsg, consume next
bind = SUPER ALT SHIFT, comma, layoutmsg, expel prev
bind = SUPER ALT SHIFT, period, layoutmsg, expel next

#apps
bind = SUPER, T, exec, [float;size 900 700;center] alacritty
bind = SUPER, R, exec, rofi -show drun
bind = SUPER, W, exec, rofi -show windoscroll_mw
bind = CTRL SHIFT, T, exec, alacritty
bind = CTRL SHIFT, W, exec, ~/.scripts/webapps.rofi.py launch
bind = CTRL SHIFT, E, exec, alacritty -e bash -ic yazi
bind = CTRL SHIFT, G, exec, [float;size 900 700;center] qutebrowser
bind = CTRL SHIFT, S, exec, [float;size 600 400;move cursor_x-10 cursor_y-30] alacritty -e python -q -i ~/.scripts/pyshell.py
bind = CTRL SHIFT, A, exec, [float;size 500 200;move cursor_x-10 cursor_y-30] alacritty -e qalc -c -e -i
bind = CTRL SHIFT, N, exec, alacritty -e nvim
bind = CTRL SHIFT, B, exec, emacsclient -c -a 'emacs'

# Window Management
bind = SUPER, Q, killactive
bind = SUPER, M, fullscreen, 1
bind = SUPER SHIFT, M, fullscreen, 0
bind = SUPER , F, togglefloating
bind = SUPER, G, togglegroup

# Numbered Workspaces
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10
bind = SUPER, BRACKETLEFT, workspace, 11
bind = SUPER, U, workspace, e+1
bind = SUPER, I, workspace, e-1

# Move to Numbered Workspaces
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10
bind = SUPER , BRACKETRIGHT, movetoworkspace, 11
bind = SUPER SHIFT, U, movetoworkspace, e+1
bind = SUPER SHIFT, I, movetoworkspace, e-1

# Focus Navigation
bind = SUPER, H, movefocus, l
bind = SUPER, J, movefocus, d
bind = SUPER, K, movefocus, u
bind = SUPER, L, movefocus, r

# Window Movement
bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, J, movewindow, d
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, L, movewindow, r

# Special Controls 
bind = SUPER , TAB, exec, dms ipc call lock lock
bind = CTRL SHIFT, XF86AudioMute, exec, [float;size 900 700;center] pavucontrol
bindel = , XF86AudioRaiseVolume, exec, dms ipc call audio increment 1
bindel = , XF86AudioLowerVolume, exec, dms ipc call audio decrement 1
bindl = , XF86AudioMute, exec, dms ipc call audio mute
bindl = , XF86AudioMicMute, exec, dms ipc call audio micmute
bindl = , XF86AudioPause, exec, dms ipc call mpris playPause
bindl = , XF86AudioPlay, exec, dms ipc call mpris playPause
bindl = , XF86AudioPrev, exec, dms ipc call mpris previous
bindl = , XF86AudioNext, exec, dms ipc call mpris next
bindel = CTRL, XF86AudioRaiseVolume, exec, dms ipc call mpris increment 3
bindel = CTRL, XF86AudioLowerVolume, exec, dms ipc call mpris decrement 3

bind = CTRL SHIFT, F5, exec, [float;size 900 700;center] pavucontrol
bindel = CTRL, F7, exec, dms ipc call audio increment 1
bindel = CTRL, F6, exec, dms ipc call audio decrement 1
bindl = CTRL, F5, exec, dms ipc call audio mute
bindl = CTRL, F8, exec, dms ipc call audio micmute
bindl = CTRL, F10, exec, dms ipc call mpris previous
bindl = CTRL, F11, exec, dms ipc call mpris playPause
bindl = CTRL, F12, exec, dms ipc call mpris next

bindel = , XF86MonBrightnessUp, exec, dms ipc call brightness increment 5 ""
bindel = , XF86MonBrightnessDown, exec, dms ipc call brightness decrement 5 ""
bindel = CTRL, F4, exec, dms ipc call brightness increment 5 ""
bindel = CTRL, f3, exec, dms ipc call brightness decrement 5 ""

# Mouse Wheel Navigation
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1
bind = SUPER CTRL, mouse_down, movetoworkspace, e+1
bind = SUPER CTRL, mouse_up, movetoworkspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindmd = SUPER, mouse:272, Move window, movewindow
bindmd = SUPER, mouse:273, Resize window, resizewindow

# Move/resize windows with mainMod + LMB/RMB and dragging
bindd = SUPER, code:20, Expand window left, resizeactive, -100 0
bindd = SUPER, code:21, Shrink window left, resizeactive, 100 0

# Screenshots
bind = , Print, exec, dms screenshot
bind = CTRL, Print, exec, dms screenshot full
bind = ALT, Print, exec, dms screenshot window

